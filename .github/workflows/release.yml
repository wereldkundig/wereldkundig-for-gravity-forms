# Releases the add-on. Push a tag with the new version, e.g. `git tag v1.2.0 && git push origin v1.2.0`.
#
# 1. Runs `composer test` and checks that the tag matches the plugin's version numbers.
# 2. Builds the package from the tagged commit with `git archive`, so the `export-ignore` lines in .gitattributes are
#    the one list of what doesn't ship, for the zip and WordPress.org alike, and checks what it holds.
# 3. Creates a GitHub Release with the zip, and the notes of that version from the readme.txt changelog.
# 4. Deploys that same package, the readme and the .wordpress-org/ assets to WordPress.org SVN.
#    Currently dry-run only (no SVN commit) until the plugin is approved and ready to go live.
#
# A version with alpha, beta, rc, dev or test in it (`v1.2.0-beta1`) is a pre-release: GitHub only, no WordPress.org.
# Run it by hand (Actions > Release > Run workflow) to only test and build a branch; the package is attached to the
# run as an artifact, nothing is released.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  SLUG: wereldkundig-for-gravity-forms

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}

    steps:
      - uses: actions/checkout@v5
        with:
          # Tags, to find the previous one for the release notes when the changelog has no section for this version.
          fetch-depth: 0
          fetch-tags: true

      - name: Version
        id: version
        run: |
          header=$(sed -nE 's/^[[:space:]]*\*[[:space:]]*Version:[[:space:]]*([^[:space:]]+).*/\1/p' "$SLUG.php" | head -n 1)

          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$header"
          fi

          if [[ "$version" =~ (alpha|beta|rc|dev|test) ]]; then
            prerelease=true
          else
            prerelease=false
          fi

          echo "Version $version, pre-release: $prerelease"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: Version numbers match the tag
        if: github.event_name == 'push'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          header=$(sed -nE 's/^[[:space:]]*\*[[:space:]]*Version:[[:space:]]*([^[:space:]]+).*/\1/p' "$SLUG.php" | head -n 1)
          constant=$(sed -nE "s/^const VERSION = '([^']+)';.*/\1/p" "$SLUG.php")
          stable=$(sed -nE 's/^Stable tag:[[:space:]]*([^[:space:]]+).*/\1/p' readme.txt | tr -d '\r')

          failed=0
          check() {
            if [ "$2" != "$VERSION" ]; then
              echo "::error::$1 is '$2', the tag is v$VERSION."
              failed=1
            fi
          }
          check "Version: in $SLUG.php" "$header"
          check "const VERSION in $SLUG.php" "$constant"
          # WordPress.org installs the Stable tag, so a pre-release (GitHub only) leaves it at the last stable version.
          if [ "$PRERELEASE" = "false" ]; then
            check "Stable tag: in readme.txt" "$stable"
          fi
          exit $failed

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none

      - name: Tests
        run: |
          composer install --no-progress --prefer-dist
          composer test

      - name: Build the package
        run: |
          mkdir build
          git archive --format=tar --prefix="$SLUG/" HEAD | tar -x -C build

      - name: The package holds what it should
        # git archive leaves out what is export-ignore and nothing else. These checks catch a runtime file that got
        # export-ignored by mistake, or a development file that isn't, before it reaches a site.
        run: |
          failed=0

          for file in "$SLUG.php" readme.txt index.php $(git ls-files app); do
            if [ ! -f "build/$SLUG/$file" ]; then
              echo "::error::Missing from the package: $file"
              failed=1
            fi
          done

          for path in .claude .github .husky .wordpress-org docs tests vendor node_modules README.md todo.md \
            composer.json composer.lock package.json package-lock.json .gitattributes .gitignore \
            .env.local.tests.example phpcs.xml.dist phpstan.neon.dist phpunit.xml.dist phpunit.live.xml.dist \
            playwright.config.ts
          do
            if [ -e "build/$SLUG/$path" ]; then
              echo "::error::Should not be in the package: $path. Add it to .gitattributes as export-ignore."
              failed=1
            fi
          done

          echo "Package:"
          (cd build && find "$SLUG" -type f | sort)
          exit $failed

      - name: Zip
        working-directory: build
        run: zip -r "$SLUG-${{ steps.version.outputs.version }}.zip" "$SLUG"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SLUG }}-${{ steps.version.outputs.version }}
          path: build/${{ env.SLUG }}
          if-no-files-found: error

      - name: Release notes
        if: github.event_name == 'push'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          # The readme.txt changelog section of this version, `= 1.2.0 =` up to the next version or section. A
          # pre-release (1.2.0-beta1) uses the section of the version it leads up to.
          base="${VERSION%%-*}"
          notes=$(awk -v heading="= $base =" '
            $0 == heading { found = 1; next }
            found && (/^= [0-9]/ || /^== /) { exit }
            found { print }
          ' readme.txt)

          # No section: the commits since the previous tag.
          if [ -z "$(printf '%s' "$notes" | tr -d '[:space:]')" ]; then
            previous=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
            if [ -n "$previous" ]; then
              notes=$(git log --no-merges --pretty=format:'- %s' "$previous..HEAD")
            else
              notes=$(git log --no-merges --pretty=format:'- %s' -20)
            fi
          fi

          # readme.txt renders HTML entities on WordPress.org; GitHub release notes are Markdown and wouldn't.
          notes=$(printf '%s\n' "$notes" | sed \
            -e 's/&rarr;/→/g' -e 's/&larr;/←/g' -e 's/&mdash;/—/g' \
            -e 's/&ndash;/–/g' -e 's/&hellip;/…/g' -e 's/&amp;/\&/g')

          if [ "$PRERELEASE" = "true" ]; then
            printf 'Pre-release %s of %s, for testing.\n\n%s\n' "$VERSION" "$base" "$notes" > build/release-notes.md
          else
            printf '%s\n' "$notes" > build/release-notes.md
          fi
          cat build/release-notes.md

      - name: GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.version.outputs.version }}
          body_path: build/release-notes.md
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          make_latest: ${{ steps.version.outputs.prerelease == 'true' && 'false' || 'true' }}
          files: build/${{ env.SLUG }}-${{ steps.version.outputs.version }}.zip

  deploy:
    name: Deploy to WordPress.org
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && needs.build.outputs.prerelease == 'false'

    # plugin-assets.yml commits to the same SVN repository; never run both at once.
    concurrency:
      group: wordpress-org-svn
      cancel-in-progress: false

    steps:
      # For readme.txt and the .wordpress-org/ assets; the plugin files come from the package below.
      - uses: actions/checkout@v5

      # The package the build job checked and zipped, so WordPress.org gets exactly the same files as the GitHub Release.
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.SLUG }}-${{ needs.build.outputs.version }}
          path: build/${{ env.SLUG }}

      # The 10up action runs svn, which the ubuntu-24.04 runner image no longer includes.
      - name: Install Subversion
        run: |
          sudo apt-get update
          sudo apt-get install -y subversion

      - name: Deploy
        uses: 10up/action-wordpress-plugin-deploy@stable
        with:
          # Skip the SVN commit until WordPress.org is ready; remove dry-run to go live.
          dry-run: true
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: ${{ env.SLUG }}
          VERSION: ${{ needs.build.outputs.version }}
          BUILD_DIR: build/${{ env.SLUG }}
